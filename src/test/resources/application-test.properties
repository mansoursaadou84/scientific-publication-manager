# Test configuration - H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console (for debugging)
spring.h2.console.enabled=true

# Security
app.jwt.secret=test-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
app.jwt.expiration=86400000

# Mail (disabled for tests)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test

# Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${java.io.tmpdir}/spm-test-uploads

# Logging
logging.level.org.springframework=WARN
logging.level.com.centre.recherche=DEBUG