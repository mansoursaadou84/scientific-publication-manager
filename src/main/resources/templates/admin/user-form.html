<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout-sidebar}">
<head>
    <title layout:fragment="title">Gestion utilisateur</title>
    <link rel="stylesheet" layout:fragment="page-styles"/>
</head>
<body>
<main layout:fragment="content">

    <div class="topbar">
        <h1 th:text="${user.id == null ? 'Nouvel utilisateur' : 'Modifier utilisateur'}">Utilisateur</h1>
    </div>

    <div class="form-card">
        <form th:action="@{/admin/users/save}" th:object="${user}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label>Nom d'utilisateur *</label>
                <input type="text" th:field="*{username}" placeholder="Nom d'utilisateur" required/>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="text" th:field="*{email}" placeholder="email@exemple.com"/>
                <div class="hint">Necessaire pour recevoir les notifications workflow</div>
            </div>

            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" name="rawPassword" placeholder="Laisser vide pour ne pas changer"/>
                <div class="hint">Laisser vide pour conserver le mot de passe actuel</div>
            </div>

            <div class="form-group">
                <label>Role *</label>
                <select th:field="*{role}" required>
                    <option th:each="r : ${T(com.centre.recherche.models.Role).values()}" th:value="${r}" th:text="${r}"></option>
                </select>
            </div>

            <div class="btn-row">
                <button type="submit" class="btn-save">Enregistrer</button>
                <a href="/admin/users" class="btn-cancel">Annuler</a>
            </div>
        </form>
    </div>

</main>
</body>
</html>
