<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Erreur serveur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/variables.css}"/>
    <link rel="stylesheet" th:href="@{/css/base.css}"/>
    <link rel="stylesheet" th:href="@{/css/components.css}"/>
    <link rel="stylesheet" th:href="@{/css/pages/error.css}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="theme-public" style="min-height:100vh;display:flex;flex-direction:column;">

    <nav class="public-nav" style="background:var(--primary, #1e3a5f);padding:1rem 2rem;">
        <a href="/" class="nav-brand" style="color:#fff;text-decoration:none;font-size:1.2rem;font-weight:700;">
            Publications Scientifiques
        </a>
    </nav>

    <main style="flex:1;display:flex;align-items:center;justify-content:center;padding:2rem;">
        <div class="error-page">
            <div class="error-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                    <line x1="12" y1="9" x2="12" y2="13"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
            </div>
            <h1>Erreur serveur</h1>
            <p class="error-message" th:text="${errorMessage} ?: 'Une erreur inattendue s&#39;est produite sur le serveur. Veuillez réessayer plus tard.'">
                Une erreur inattendue s'est produite sur le serveur. Veuillez réessayer plus tard.
            </p>
            <p class="error-hint">
                Si le problème persiste, veuillez contacter l'administrateur du site.
            </p>
            <div class="error-actions">
                <a href="/" class="btn-primary">Retour à l'accueil</a>
                <a href="javascript:history.back()" class="btn-secondary">Page précédente</a>
            </div>
        </div>
    </main>

    <footer style="text-align:center;padding:1rem;color:var(--text-muted, #6b7280);font-size:0.85rem;border-top:1px solid var(--border, #e5e7eb);">
        Centre de Recherche et d'Innovation de Settat
    </footer>

</body>
</html>
