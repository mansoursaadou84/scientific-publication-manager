<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout-auth}">
<head>
    <title layout:fragment="title">Inscription</title>
</head>
<body>
<main layout:fragment="content">
    <div class="auth-card">
        <div class="auth-left">
            <span class="badge">Nouveau compte</span>
            <h1>Rejoignez la plateforme</h1>
            <p>Creez votre espace chercheur pour soumettre et gerer vos publications scientifiques.</p>
        </div>
        <div class="auth-right">
            <h2>Creer un compte</h2>
            <p class="sub">Remplissez les informations ci-dessous</p>
            <form th:action="@{/register}" th:object="${user}" method="post">
                <label>Nom d'utilisateur</label>
                <input type="text" th:field="*{username}" placeholder="Choisissez un nom d'utilisateur" required/>
                <label>Email</label>
                <input type="email" th:field="*{email}" placeholder="votre.email@universite.fr"/>
                <label>Mot de passe</label>
                <input type="password" name="password" id="password" placeholder="Choisissez un mot de passe" required/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="auth-btn">Creer mon compte</button>
            </form>
            <div class="auth-link">Deja un compte ? <a href="/login">Se connecter</a></div>
        </div>
    </div>
</main>
</body>
</html>
