<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title layout:fragment="title">Publications Scientifiques</title>
    <meta name="description" content="Plateforme de gestion des publications scientifiques du centre de recherche"/>
    <meta property="og:site_name" content="Publications Scientifiques"/>
    <meta property="og:type" content="website"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/variables.css}"/>
    <link rel="stylesheet" th:href="@{/css/base.css}"/>
    <link rel="stylesheet" th:href="@{/css/components.css}"/>
    <link rel="stylesheet" th:href="@{/css/layout-public.css}"/>
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" layout:fragment="page-styles"/>
</head>
<body class="theme-public">
    <a href="#main-content" class="skip-link">Aller au contenu principal</a>
    <header th:replace="~{fragments :: public-nav}"></header>
    <main id="main-content" layout:fragment="content"></main>
    <footer th:replace="~{fragments :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
    <script layout:fragment="page-scripts"></script>
</body>
</html>
