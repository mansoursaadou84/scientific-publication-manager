# ── Profil MySQL (production / Docker) ────────────────────────
# Activer avec : mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Ou via Docker : SPRING_PROFILES_ACTIVE=mysql (voir docker-compose.yml)

spring.datasource.url=jdbc:mysql://localhost:3307/scientific_publication_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Desactiver H2 en profil MySQL
spring.h2.console.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration